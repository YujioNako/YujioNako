<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Training Simulator</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="1200" height="800"></canvas>
        
        <!-- UI Overlay -->
        <div id="ui-overlay">
            <!-- HUD -->
            <div id="hud">
                <div id="weapon-info">
                    <span id="weapon-name">Pistol</span>
                    <span id="ammo-count">12/36</span>
                </div>
                <div id="crosshair"></div>
                <div id="stats-display">
                    <div>Accuracy: <span id="accuracy">0%</span></div>
                    <div>Hits: <span id="hits">0</span></div>
                    <div>Shots: <span id="shots">0</span></div>
                </div>
            </div>
            
            <!-- Main Menu -->
            <div id="main-menu" class="menu active">
                <h1>FPS Training Simulator</h1>
                <div class="menu-buttons">
                    <button id="start-tracking">Tracking Training</button>
                    <button id="start-positioning">Positioning Training</button>
                    <button id="settings-btn">Settings</button>
                </div>
            </div>
            
            <!-- Settings Menu -->
            <div id="settings-menu" class="menu">
                <h2>Settings</h2>
                <div class="settings-group">
                    <label>Mouse Sensitivity: <span id="sensitivity-value">1.0</span></label>
                    <input type="range" id="sensitivity-slider" min="0.1" max="5.0" step="0.1" value="1.0">
                </div>
                <div class="settings-group">
                    <label>Master Volume: <span id="volume-value">50%</span></label>
                    <input type="range" id="volume-slider" min="0" max="100" step="5" value="50">
                </div>
                <div class="settings-group">
                    <label>Target Distance: <span id="distance-value">400px</span></label>
                    <input type="range" id="distance-slider" min="200" max="800" step="50" value="400">
                </div>
                <div class="settings-group">
                    <label>Target Size: <span id="target-size-value">200px</span></label>
                    <input type="range" id="target-size-slider" min="100" max="400" step="50" value="200">
                </div>
                <button id="back-to-menu">Back to Menu</button>
            </div>
            
            <!-- Pause Menu -->
            <div id="pause-menu" class="menu">
                <h2>Paused</h2>
                <div class="menu-buttons">
                    <button id="resume-game">Resume</button>
                    <button id="restart-game">Restart</button>
                    <button id="quit-game">Quit to Menu</button>
                </div>
            </div>
        </div>
        
        <!-- Mobile Controls -->
        <div id="mobile-controls" class="mobile-only">
            <div id="virtual-joystick-left">
                <div class="joystick-outer">
                    <div class="joystick-inner"></div>
                </div>
            </div>
            <div id="mobile-buttons">
                <button id="shoot-btn" class="mobile-btn">FIRE</button>
                <button id="reload-btn" class="mobile-btn">RELOAD</button>
                <button id="weapon-switch-btn" class="mobile-btn">SWITCH</button>
            </div>
        </div>
    </div>
    
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <h2>Loading FPS Training Simulator...</h2>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="js/weapons.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/mobile.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
